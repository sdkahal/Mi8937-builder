#!/usr/sbin/nft -f

# nftables configuration for Mi8937
# Firewall filter: control incoming traffic

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow loopback
        iifname "lo" accept

        # Allow established/related connections
        ct state established,related accept

        # Allow all traffic from USB
        iifname usb0 accept

        # Allow SSH from WiFi
        iifname "wlan*" tcp dport {ssh} accept
    }
}
