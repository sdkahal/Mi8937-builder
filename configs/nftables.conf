#!/usr/sbin/nft -f

# nftables configuration for Mi8937
# Firewall filter: control incoming traffic

flush ruleset

table inet filter {

    set ssh_allowed {
        type ipv4_addr
        elements = { 127.0.0.1 }
    }

    chain input {
        type filter hook input priority 0; policy drop;

        iifname "lo" accept                                   
        ct state established,related accept                   

        ct state invalid drop

        ip protocol icmp icmp type {
            echo-request, echo-reply,
            destination-unreachable,
            time-exceeded,
            parameter-problem
        } accept

        ip6 nexthdr icmpv6 icmpv6 type {
            echo-request, echo-reply,
            destination-unreachable,
            time-exceeded,
            packet-too-big,
            parameter-problem
        } accept

        iifname "usb0" accept

        iifname "wlan*" tcp dport 22 ip saddr @ssh_allowed ct state new \
            limit rate 10/minute burst 20 packets accept

        udp sport 67 udp dport 68 accept

        # udp dport 53 accept

        ct state invalid limit rate 5/minute log prefix "invalid: " level warn

        tcp dport 22 ct state new limit rate 5/minute log prefix "ssh-deny: " level warn

        # drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
